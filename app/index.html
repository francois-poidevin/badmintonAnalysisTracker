<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Badminton Analysis Tracker</title><link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--lava:#780000;--red:#c1121f;--cream:#fdf0d5;--space:#003049;--steel:#669bbc;--sk:-12deg}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,sans-serif;color:var(--cream);min-height:100vh;
 background:radial-gradient(1200px 600px at 85% -10%,#0a5a85 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,var(--lava) 0,transparent 55%),var(--space)}
header{display:flex;align-items:center;gap:1rem;padding:1rem 1.5rem .2rem}
h1{margin:0;font-size:clamp(1.3rem,2.5vw,2rem);letter-spacing:-.02em}
h1 span{color:var(--red);background:var(--cream);padding:0 .35em;margin-left:.2em;display:inline-block;transform:skewX(var(--sk))}
#lang{margin-left:auto;background:#ffffff14;color:var(--cream);border:1px solid #ffffff40;border-radius:99px;padding:.35rem .9rem;cursor:pointer;backdrop-filter:blur(6px)}
#lang:hover{background:#ffffff30}
/* stepper with oblique separators */
.steps{display:flex;margin:.8rem 1.5rem;gap:0;font-weight:700}
.steps b{flex:1;padding:.55rem 1rem .55rem 1.6rem;background:#ffffff12;color:var(--steel);text-align:center;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);margin-left:-8px;font-size:.9rem}
.steps b:first-child{margin-left:0;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.steps b:nth-child(1){background:linear-gradient(90deg,var(--steel),#4d86a8);color:var(--space)}
.steps b:nth-child(2){background:linear-gradient(90deg,#4d86a8,#2f6e93);color:#fff}
.steps b:nth-child(3){background:linear-gradient(90deg,#2f6e93,var(--red));color:#fff}
.steps b:nth-child(4){background:linear-gradient(90deg,var(--red),var(--lava));color:var(--cream)}
.steps i{font-style:normal;display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--cream);color:var(--space);margin-right:.4em}
/* 3-column layout; panels have slanted edges, oblique dividers in between */
main{display:grid;grid-template-columns:minmax(190px,1fr) minmax(0,3.2fr) minmax(190px,1fr);gap:0;padding:0 1.5rem 1.5rem}
.col{display:flex;flex-direction:column;gap:.8rem;padding:1rem;background:#ffffff0d;border:1px solid #ffffff1c;backdrop-filter:blur(8px)}
.col.l{clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,0 100%);padding-right:2rem;border-radius:18px 0 0 18px}
.col.r{clip-path:polygon(22px 0,100% 0,100% 100%,0 100%);padding-left:2rem;border-radius:0 18px 18px 0;align-items:stretch}
.col.m{background:transparent;border:0;padding:0 .6rem;backdrop-filter:none}
.tag{display:inline-block;align-self:flex-start;background:var(--red);color:var(--cream);font-weight:800;padding:.15rem .8rem;transform:skewX(var(--sk));letter-spacing:.04em;text-transform:uppercase;font-size:.8rem}
.tag em{font-style:normal;display:inline-block;transform:skewX(calc(-1*var(--sk)))}
label.row{display:grid;grid-template-columns:2.2rem 1fr;align-items:center;gap:.1rem .6rem}
label.row svg{width:2rem;height:2rem;stroke:var(--steel);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;grid-row:span 2;padding:.3rem;background:#0030499a;border-radius:10px}
label.row small{color:var(--steel);font-weight:600}
select,input[type=number]{background:#00243a;color:var(--cream);border:1px solid var(--steel);border-radius:8px;padding:.35rem .5rem;font:inherit;min-width:0;width:100%}
.opt{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;color:var(--steel)}.opt input,.opt select{width:auto}
/* court hint */
.hint{display:flex;align-items:center;gap:.8rem;padding:.6rem 1rem;margin-bottom:.6rem;background:linear-gradient(90deg,var(--red),var(--lava));clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);justify-content:center;text-align:center}
.hint svg{width:1.6rem;height:1.6rem;stroke:var(--cream);fill:none;stroke-width:2;animation:tap 1.4s ease-in-out infinite;flex:none}
@keyframes tap{50%{transform:translate(3px,3px) scale(.88)}}
.hint button{background:var(--cream);color:var(--lava);border:0;border-radius:99px;padding:.25rem .8rem;font-weight:700;cursor:pointer}
canvas{width:100%;height:auto;background:#000;cursor:crosshair;display:block;border-radius:14px;border:3px solid var(--steel);box-shadow:0 12px 40px #000a,0 0 0 6px #ffffff10}
#info{color:var(--steel);font-size:.85rem;text-align:center;word-break:break-word}
/* upload button: gradient + pulsing rings */
.up{position:relative;display:grid;place-items:center;gap:.4rem;padding:1.6rem 1rem;text-align:center;cursor:pointer;font-weight:800;font-size:1.05rem;color:var(--space);
 background:linear-gradient(135deg,var(--cream),#ffd89a,var(--cream));background-size:200% 200%;animation:sheen 4s linear infinite;border-radius:18px;transition:transform .2s}
.up:hover{transform:scale(1.04) rotate(-1deg)}.up input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.up svg{width:3rem;height:3rem;stroke:var(--red);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;animation:bob 1.6s ease-in-out infinite}
.up::before,.up::after{content:"";position:absolute;inset:0;border-radius:18px;border:3px solid var(--red);animation:ring 2.2s ease-out infinite;pointer-events:none}
.up::after{animation-delay:1.1s}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.25,1.4);opacity:0}}
@keyframes bob{50%{transform:translateY(-6px)}}@keyframes sheen{50%{background-position:100% 100%}}
/* run panel with liquid button */
.run{margin-top:.8rem;display:flex;flex-wrap:wrap;gap:.8rem 1rem;align-items:center;justify-content:center;padding:1rem;background:#ffffff0d;border:1px solid #ffffff1c;clip-path:polygon(18px 0,100% 0,calc(100% - 18px) 100%,0 100%)}
.run .tag{margin-right:auto}
.cta{display:inline-flex;align-items:center;gap:.6rem;border:0;cursor:pointer;color:#fff;font:700 1rem system-ui;padding:.8rem 1.8rem;border-radius:12px;background:linear-gradient(180deg,var(--red),#a30e19);box-shadow:0 1px 0 #ffffff55 inset,0 8px 20px #c1121f55;transition:transform .15s,box-shadow .15s}
.cta::before{content:"";width:0;height:0;border-left:.8em solid currentColor;border-top:.5em solid transparent;border-bottom:.5em solid transparent}
.cta:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 1px 0 #ffffff55 inset,0 12px 26px #c1121f88}.cta:active:not(:disabled){transform:translateY(0) scale(.98)}
.cta:focus-visible{outline:3px solid var(--steel);outline-offset:3px}
.cta:disabled{background:#ffffff1a;color:#ffffff66;box-shadow:none;cursor:not-allowed}
.run button:not(.cta){background:#ffffff18;color:var(--cream);border:1px solid var(--steel);border-radius:99px;padding:.5rem 1.1rem;font:600 .95rem system-ui;cursor:pointer;transition:background .2s}
.run button:not(.cta):hover:not(:disabled){background:var(--steel);color:var(--space)}
.run button:disabled:not(.cta){opacity:.35;cursor:not-allowed}
.stat{flex-basis:100%;display:flex;align-items:center;gap:.8rem}
progress{flex:1;height:.7rem;appearance:none;border:0;border-radius:99px;overflow:hidden;background:#ffffff20}
progress::-webkit-progress-bar{background:#ffffff20}progress::-webkit-progress-value{background:linear-gradient(90deg,var(--steel),var(--red))}
#st{font-weight:600;color:var(--cream)}
details{margin:0 1.5rem 1.5rem;padding:.6rem 1rem;background:#ffffff0d;border-radius:12px;color:var(--cream)}summary{cursor:pointer;color:var(--steel)}
@media(max-width:860px){main{grid-template-columns:1fr}.col.l,.col.r{clip-path:none;border-radius:14px;padding:1rem}.col.m{display:contents}.col.m>*{order:-1}.col.m>.run{order:9;margin-top:0}main{display:flex;flex-direction:column;gap:1rem}.steps b{font-size:.7rem;padding:.5rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

 <div style="color:var(--steel);font-weight:600;margin-top:.4rem" data-i="feat"></div>

const I={
en:{title:'Badminton Analysis Tracker',helpSum:`<b>How to use</b> (everything runs in your browser; the video never leaves your computer)`,help:`<ol>
<li><b>Video</b>: choose a match clip. Best results: fixed camera, whole court visible, 30 fps, a few minutes at most. It is kept in the browser storage, so it is still there after a reload.</li>
<li><b>Engines</b> (see choices below), then <b>Weight</b> (used for calories only; changing it later updates the table at once, no re-analysis).</li>
<li><b>Court</b>: click the 4 court corners on the picture, in this order: far-left, far-right, near-right, near-left (outer lines, doubles court). The corners are used to convert pixels into metres.</li>
<li><b>Analyse</b>: runs the models on every frame (slow, depends on your GPU; you see what the models detect live). <b>Cancel</b> stops it and discards the partial result.</li>
<li><b>Preview AR</b>: replays the video with the overlay (court lines, skeletons, player ids and colours, shuttle with tail and speed, shot type above the player and a per-player shot table on the left, mini-map with player paths, distance and kcal table). It can be replayed as often as you want; no new computation.</li>
<li><b>Export AR mp4</b>: encodes the same overlay into a downloadable MP4 (video only, no sound).</li>
</ol>
<p><b>Engines - what each choice means</b></p>
<ul>
<li><b>Pose: RTMPose-s + YOLOX-tiny</b> (default, Apache-2.0): two steps, first find each person, then estimate the 17 body points. More accurate on small, far players; slower; the first run also downloads about 40 MB.
 <b>YOLOv8n-pose</b>: one step, faster, usually less precise on distant players, and its licence (AGPL) is restrictive if you reuse it in a product. Bad pose = wrong feet position, hence wrong distance, calories and map.</li>
<li><b>Shuttle: TrackNetV3</b> (default, 45 MB download): finds the shuttle in every frame; needed for the shuttle tail and km/h. It reads 8 frames at a time and builds an empty-court background first, so it works best with a fixed camera. <b>off</b>: no shuttle, no speed, but analysis is faster (only the frames selected by "every N" are read).</li>
<li><b>Analyse every N frames</b> (pose only): 1 = most precise, slowest. 2-5 = faster; the frames in between are interpolated, so quick movements are smoothed (distance may be slightly underestimated). Shuttle detection always uses every frame when it is on.</li>
</ul>
<p><b>Court corners</b>: the accuracy of every metre value (positions, distance, calories, shuttle km/h) depends on these 4 clicks. Click precisely on the outer line intersections. Wrong order or a shifted corner gives a mirrored/skewed map and wrong distances. Only people inside the court or within 0.6 m of it are tracked (spectators and referees are ignored). The map shows the far end at the top, as in the corner order above.</p>
<p><b>Reset</b>: clears the 4 corners <u>and</u> the analysis results (preview and export become unavailable). The video stays loaded. You must click the corners again and re-run Analyse. Use it if a corner was misplaced, or the camera moved. To only change weight, no reset is needed.</p>
<p><small>Speeds and kcal are estimates: the shuttle speed is measured on the court plane (overestimates when the shuttle is high); calories use average METs by player speed.</small></p>

fr:{title:"Badminton Analysis Tracker",helpSum:`<b>Mode d'emploi</b> (tout s'exécute dans votre navigateur ; la vidéo ne quitte jamais votre ordinateur)`,help:`<ol>
<li><b>Vidéo</b> : choisissez un extrait de match. Meilleurs résultats : caméra fixe, terrain entier visible, 30 i/s, quelques minutes au plus. Elle est conservée dans le stockage du navigateur, donc toujours là après un rechargement.</li>
<li><b>Moteurs</b> (voir les choix ci-dessous), puis <b>Poids</b> (utilisé pour les calories uniquement ; le modifier plus tard met le tableau à jour immédiatement, sans nouvelle analyse).</li>
<li><b>Terrain</b> : cliquez les 4 coins du terrain sur l'image, dans cet ordre : fond-gauche, fond-droite, avant-droite, avant-gauche (lignes extérieures, terrain de double). Les coins servent à convertir les pixels en mètres.</li>
<li><b>Analyser</b> : exécute les modèles sur chaque image (lent, dépend de votre GPU ; vous voyez en direct ce que les modèles détectent). <b>Annuler</b> l'arrête et écarte le résultat partiel.</li>
<li><b>Aperçu AR</b> : rejoue la vidéo avec la surcouche (lignes du terrain, squelettes, identifiants et couleurs des joueurs, volant avec traînée et vitesse, type de coup au-dessus du joueur et tableau des coups par joueur à gauche, mini-carte avec trajets des joueurs, tableau distance et kcal). Rejouable à volonté ; aucun nouveau calcul.</li>
<li><b>Exporter AR mp4</b> : encode la même surcouche dans un MP4 téléchargeable (image seule, sans son).</li>
</ol>
<p><b>Moteurs - signification de chaque choix</b></p>
<ul>
<li><b>Pose : RTMPose-s + YOLOX-tiny</b> (défaut, Apache-2.0) : deux étapes, d'abord trouver chaque personne, puis estimer les 17 points du corps. Plus précis sur les joueurs petits et éloignés ; plus lent ; le premier lancement télécharge aussi environ 40 Mo.
 <b>YOLOv8n-pose</b> : une seule étape, plus rapide, généralement moins précis sur les joueurs éloignés, et sa licence (AGPL) est contraignante si vous le réutilisez dans un produit. Mauvaise pose = mauvaise position des pieds, donc distance, calories et carte faussées.</li>
<li><b>Volant : TrackNetV3</b> (défaut, 45 Mo) : trouve le volant sur chaque image ; nécessaire pour la traînée du volant et les km/h. Il lit 8 images à la fois et construit d'abord un fond de terrain vide, donc il marche mieux avec une caméra fixe. <b>désactivé</b> : pas de volant, pas de vitesse, mais l'analyse est plus rapide (seules les images choisies par « toutes les N » sont lues).</li>
<li><b>Analyser toutes les N images</b> (pose uniquement) : 1 = plus précis, plus lent. 2-5 = plus rapide ; les images intermédiaires sont interpolées, donc les mouvements rapides sont lissés (distance légèrement sous-estimée). La détection du volant utilise toujours toutes les images quand elle est active.</li>
</ul>
<p><b>Coins du terrain</b> : la précision de toutes les valeurs en mètres (positions, distance, calories, km/h du volant) dépend de ces 4 clics. Cliquez précisément sur les intersections des lignes extérieures. Un mauvais ordre ou un coin décalé donne une carte inversée/déformée et des distances fausses. Seules les personnes sur le terrain ou à moins de 0,6 m sont suivies (spectateurs et arbitres ignorés). La carte montre le fond du terrain en haut.</p>
<p><b>Réinitialiser</b> : efface les 4 coins <u>et</u> les résultats d'analyse (aperçu et export deviennent indisponibles). La vidéo reste chargée. Il faut recliquer les coins et relancer l'analyse. À utiliser si un coin est mal placé ou si la caméra a bougé. Pour changer seulement le poids, pas besoin de réinitialiser.</p>
<p><small>Vitesses et kcal sont des estimations : la vitesse du volant est mesurée sur le plan du terrain (surestimée quand le volant est haut) ; les calories utilisent des METs moyens selon la vitesse du joueur.</small></p>

    const t=`${ts(s.type)}${s.bad?' ['+ts(s.bad)+']':''}`,x=p.kp[0][0]-g.measureText(t).width/2,y=p.box[1]-12;g.strokeText(t,x,y);g.fillText(t,x,y)}

// comet tail: length grows with speed (3 frames at rest -> 25 frames at ~440 km/h)

  g.save();g.lineCap='round';const r=Math.max(5,c.width/170);

  t0=performance.now();
  try{let bg=null;
    if(shut.run){setState('analysing',['bgBuild']);bg=await shut.background(seek,v.duration,(i,k)=>progress(i,k,'background'));t0=performance.now()}
    const B=shut.run?8:1;results=new Array(n);
    for(let w=0;w<n&&!cancel;w+=B){const fr=[];
      for(let j=0;j<B;j++){const i=Math.min(w+j,n-1);if(!shut.run&&i%step)continue;
        await seek(i/FPS);g.drawImage(v,0,0,c.width,c.height);
        if(w+j<n&&i%step===0){const t1=performance.now();live.people=await pose.run(c);(results[i]??={}).people=live.people;live.msg=T('detected',(performance.now()-t1)|0,live.people.length)}
        if(shut.run)fr.push(shut.frame(c));
        liveDraw(i,n)}                                   // drawn every frame -> no blinking
      if(shut.run){const t2=performance.now();const out=await shut.run(fr,bg);live.hm=shut.hm;live.hmj=Math.min(7,fr.length-1);
        live.shut=out.map(p=>p&&[p[0]*c.width/TW,p[1]*c.height/TH]);live.msg+=`  | TrackNet ${(performance.now()-t2)|0} ms`;liveDraw(Math.min(w+live.hmj,n-1),n)
        out.forEach((p,j)=>{const i=w+j;if(i<n)(results[i]??={people:null}).shuttle=p?[p[0]*c.width/TW,p[1]*c.height/TH]:null})}
      progress(w,n,'analysing')}live.people=[];live.shut=[];live.hm=null}
  catch(e){console.error(e);results=[];setState('ready',['err',String(e.message||e).slice(0,200)]);return}
  if(cancel){results=[];setState('ready',['cancelled'])}else{const r=track(results,Math.floor(v.duration*FPS));results=r.out;v.currentTime=0;{const cnt={};r.strokes.forEach(k=>cnt[k.type]=(cnt[k.type]||0)+1);console.log('strokes',r.strokes);setState('analysed',['done',r.tracks,r.filled,r.strokes.length,Object.entries(cnt).map(e=>e[1]+' '+ts(e[0])).join(', '),r.strokes.filter(k=>k.bad).length])}}};
$('cancel').onclick=()=>cancel=true;

// ================= preview (no inference, uses stored results) =================
let played=false,runId=0; // played = a preview already ran -> button says Replay
$('prev').onclick=async()=>{
  if(state==='previewing'){v.pause();return}            // stop: the pause listener below resets the state
  const id=++runId;setState('previewing');
  await seek(0);                                         // always restart from the beginning
  try{await v.play()}catch(e){setState('analysed',['playFail',e.message]);return}   // wait until really playing
  let finished=false;
  const finish=()=>{if(finished||id!==runId)return;finished=true;v.removeEventListener('pause',finish);v.removeEventListener('ended',finish);
    draw(hold(fi()),fi());played=true;setState('analysed',[v.ended?'prevEnd':'prevStop'])};
  v.addEventListener('pause',finish);v.addEventListener('ended',finish);              // 'ended' also fires 'pause'; guarded
  const loop=()=>{if(id!==runId||finished)return;draw(hold(fi()),fi());if(!v.paused&&!v.ended)v.requestVideoFrameCallback(loop)};
  v.requestVideoFrameCallback(loop)};

// ================= export (also from stored results: fast, no inference) =================
$('exp').onclick=async()=>{
  const n=Math.floor(v.duration*FPS);setState('exporting',['encoding']);cancel=false;t0=performance.now();
  let enc;
  try{
    const m=new Muxer({target:new ArrayBufferTarget(),video:{codec:'avc',width:c.width,height:c.height},fastStart:'in-memory'});
    let err=null;enc=new VideoEncoder({output:(ch,md)=>m.addVideoChunk(ch,md),error:e=>err=e});
    enc.configure({codec:'avc1.640034',width:c.width,height:c.height,bitrate:6e6,framerate:FPS});
    for(let i=0;i<n;i++){if(cancel){enc.close();setState('analysed',['expCancel']);return}if(err)throw err;
      await seek(i/FPS);draw(hold(i),i);
      const fr=new VideoFrame(c,{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)}); // duration is required by the muxer
      enc.encode(fr,{keyFrame:i%60===0});fr.close();
      if(enc.encodeQueueSize>10)await new Promise(r=>setTimeout(r));progress(i,n,'encoding')}
    await enc.flush();if(err)throw err;m.finalize();
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([m.target.buffer],{type:'video/mp4'}));a.download='rally-ar.mp4';a.click();
    setState('analysed',['exported',(m.target.buffer.byteLength/1e6).toFixed(1)])
  }catch(e){console.error(e);try{enc&&enc.state!=='closed'&&enc.close()}catch{}setState('analysed',['expErr',String(e.message||e).slice(0,200)])}};
setState('idle',['pickVideo']);applyLang();
</script>
